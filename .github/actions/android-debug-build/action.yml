name: 'Android Debug Build'
description: 'Build a debug APK with Gradle and ccache caches that main saves and branches restore'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: '17'

    # Saves ~/.gradle (dependencies and the build cache) only on main;
    # branches restore main's latest state read-only.
    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

    - name: Cache Native Compilation
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: android-debug
        max-size: 1G
        save: ${{ github.ref == 'refs/heads/main' }}

    - name: Generate Native Project
      shell: bash
      run: pnpm expo prebuild --platform android --no-install

    - name: Build Debug APK
      shell: bash
      # CMake reads these on configure, so every native module (the app,
      # Reanimated, Gesture Handler, ...) compiles through ccache. Gradle
      # installs the NDK afresh each run, so ccache identifies the compiler by
      # its content rather than its modification time.
      env:
        CMAKE_C_COMPILER_LAUNCHER: ccache
        CMAKE_CXX_COMPILER_LAUNCHER: ccache
        CCACHE_COMPILERCHECK: content
      run: ./android/gradlew -p android assembleDebug -PreactNativeArchitectures=x86_64
