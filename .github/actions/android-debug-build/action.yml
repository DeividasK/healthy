name: 'Android Debug Build'
description: 'Build a debug APK with Gradle and ccache caches that main saves and branches restore'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    # Saves ~/.gradle (dependencies and the build cache) only on main;
    # branches restore main's latest state read-only.
    - uses: gradle/actions/setup-gradle@v5

    - name: Cache Native Compilation
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: android-debug
        max-size: 1G
        save: ${{ github.ref == 'refs/heads/main' }}

    - name: Generate Native Project
      shell: bash
      run: pnpm expo prebuild --platform android --no-install

    - name: Build Debug APK
      shell: bash
      # CMake reads these on configure, so every native module (the app,
      # Reanimated, Gesture Handler, ...) compiles through ccache.
      env:
        CMAKE_C_COMPILER_LAUNCHER: ccache
        CMAKE_CXX_COMPILER_LAUNCHER: ccache
      run: ./android/gradlew -p android assembleDebug -PreactNativeArchitectures=x86_64
