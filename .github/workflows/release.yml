name: Release

# Publish a stable GitHub Release to ship its tagged commit. The internal
# release branch advances to that commit to trigger the existing EAS pipeline.
on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify & Dispatch Release
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./app.json').expo.version")
          test "$RELEASE_TAG" = "v$version" || { echo "::error::Release tag must match app.json version v$version."; exit 1; }
          test "$(node -p "require('./package.json').version")" = "$version" || { echo "::error::App and package versions differ."; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::Release commit must already be on main."; exit 1; }
          git merge-base --is-ancestor origin/release HEAD || { echo "::error::Release must fast-forward the previous release."; exit 1; }
          if ls .changes/unreleased/*.yaml > /dev/null 2>&1; then
            echo "::error::Unreleased fragments in .changes/unreleased. Run 'pnpm release:prepare' on main first."
            exit 1
          fi
          test -f ".changes/$version.md" || { echo "::error::No release notes for $version in .changes/"; exit 1; }

      # EAS listens for this branch's push webhook. GitHub Pages is deployed
      # below from the same tag; a branch push no longer starts this workflow.
      - name: Start Android Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/release" \
            -f sha="$(git rev-parse HEAD)" -F force=false

  deploy-to-github-pages:
    name: Build & Deploy to GitHub Pages
    needs: [verify-release]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          cache: true

      - name: Build for GitHub Pages
        uses: ./.github/actions/build-web
        with:
          base-url: /healthy

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
