name: Release

# Pushing to `release` ships the version in app.json: a GitHub Release with its
# release notes (.changes/<version>.md), and the web app on GitHub Pages. EAS builds and submits
# Android from the same push (.eas/workflows/android-release.yml).
on:
  push:
    branches: [release]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  github-release:
    name: GitHub Release
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Ships only a prepared version (pnpm release:prepare): its release
      # notes exist and no fragments are left unreleased.
      - name: Verify Release Notes
        run: |
          version=$(node -p "require('./app.json').expo.version")
          if ls .changes/unreleased/*.yaml > /dev/null 2>&1; then
            echo "::error::Unreleased fragments in .changes/unreleased. Run 'pnpm release:prepare' on main first."
            exit 1
          fi
          test -f ".changes/$version.md" || { echo "::error::No release notes for $version in .changes/"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # A push that keeps the version (e.g. a merge back from main without a
      # prepared release) leaves the existing release alone.
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already released."
            exit 0
          fi
          tail -n +2 ".changes/$VERSION.md" > release-notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-notes.md

  deploy-to-github-pages:
    name: Build & Deploy to GitHub Pages
    needs: [github-release]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          cache: true

      - name: Build for GitHub Pages
        uses: ./.github/actions/build-web
        with:
          base-url: /healthy

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
