name: Google Token Service

# Deploys workers/google-token to Cloudflare. Setup: docs/google-token-service.md
on:
  push:
    branches: [main]
    paths:
      - 'workers/google-token/**'
      - '.github/workflows/google-token.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Worker
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/google-token
          secrets: |
            GOOGLE_CLIENT_SECRET
