name: Pages

# usehealthy.app is one GitHub Pages site: the landing page in site/ at the
# root, the released web app under /a, its demo under /d, and the latest main
# build under /i, which nothing links to. Every push to main redeploys the
# landing page and /i; /a and /d are always built from the latest release, so
# a change on main never ships unreleased code to them.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build the app from'
        required: true
        type: string

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - name: Resolve Release
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${INPUT_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout Release
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      # The landing page, the build action and /i come from the default
      # branch, not from the release, so deploying an older release keeps
      # them current.
      - name: Checkout Main
        uses: actions/checkout@v7
        with:
          path: .pages
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      # base_path is /healthy until the custom domain is set, then empty.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build App
        uses: ./.pages/.github/actions/build-web
        with:
          base-url: ${{ steps.pages.outputs.base_path }}/a

      - name: Build Latest App
        working-directory: .pages
        env:
          EXPO_BASE_URL: ${{ steps.pages.outputs.base_path }}/i
          # Its own database and settings, apart from the released app's.
          EXPO_PUBLIC_STORAGE_NAMESPACE: i
        run: |
          pnpm install --frozen-lockfile
          pnpm build:web

      # The released app again, opening a demo profile in an in-memory
      # database, so the landing page's demo never touches the app's records.
      - name: Build Demo App
        env:
          EXPO_BASE_URL: ${{ steps.pages.outputs.base_path }}/d
          EXPO_PUBLIC_DEMO_BUILD: '1'
          EXPO_PUBLIC_STORAGE_NAMESPACE: d
        run: pnpm build:web --output-dir dist-demo

      # Opens the demo build once and saves its demo profile as demo.db.gz, so
      # visitors load it instead of waiting for every record to be written.
      # A release from before this step has no snapshot export and skips it;
      # its demo creates the records as before.
      - name: Make Ready-made Demo
        working-directory: .pages
        run: |
          pnpm exec playwright install --with-deps chromium
          if ! grep -rq '__HEALTHY_DEMO_SNAPSHOT__' ../dist-demo/_expo/static/js/web/; then
            echo "::warning::This release cannot export a ready-made demo"
            exit 0
          fi
          node scripts/demo-snapshot.mjs ../dist-demo

      - name: Assemble Site
        run: |
          mkdir _site
          cp -R .pages/site/. _site/
          cp -R dist _site/a
          cp -R .pages/dist _site/i
          cp -R dist-demo _site/d
          # Keep /i and /d out of search results.
          for app in i d; do
            sed -i 's#<head>#<head><meta name="robots" content="noindex" />#' "_site/$app/index.html"
          done
          # Pages can't send headers, so every page carries its own policy,
          # made from the configuration its app was built with: /a and /d from
          # the release, /i and the landing page from main.
          node .pages/scripts/content-security-policy.mjs _site/a .env
          node .pages/scripts/content-security-policy.mjs _site/d .env
          node .pages/scripts/content-security-policy.mjs _site/i .pages/.env
          node .pages/scripts/content-security-policy.mjs _site .pages/.env
          # Unknown paths fall back to the app they are under, so deep links
          # load. GitHub Pages has one 404 page, so it writes the right shell,
          # which brings that app's policy.
          node .pages/scripts/pages-404.mjs _site
          # The landing page downloads the demo's files ahead of a click.
          node .pages/scripts/demo-prefetch.mjs _site
          touch _site/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
