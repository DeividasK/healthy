name: Pages

# usehealthy.app is one GitHub Pages site: the landing page in site/ at the
# root, the released web app under /a, and the latest main build under /i,
# which nothing links to. Every push to main redeploys the landing page and
# /i; /a is always built from the latest release, so a change on main never
# ships unreleased code to /a.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build the app from'
        required: true
        type: string

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - name: Resolve Release
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${INPUT_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout Release
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      # The landing page, the build action and /i come from the default
      # branch, not from the release, so deploying an older release keeps
      # them current.
      - name: Checkout Main
        uses: actions/checkout@v7
        with:
          path: .pages
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: pnpm/setup@v3
        with:
          cache: true

      # base_path is /healthy until the custom domain is set, then empty.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build App
        uses: ./.pages/.github/actions/build-web
        with:
          base-url: ${{ steps.pages.outputs.base_path }}/a

      - name: Build Latest App
        working-directory: .pages
        env:
          EXPO_BASE_URL: ${{ steps.pages.outputs.base_path }}/i
          # Its own database and settings, apart from the released app's.
          EXPO_PUBLIC_STORAGE_NAMESPACE: i
        run: |
          pnpm install --frozen-lockfile
          pnpm build:web

      - name: Assemble Site
        run: |
          mkdir _site
          cp -R .pages/site/. _site/
          cp -R dist _site/a
          cp -R .pages/dist _site/i
          # Keep /i out of search results.
          sed -i 's#<head>#<head><meta name="robots" content="noindex" />#' _site/i/index.html
          # Unknown paths fall back to the app they are under, so deep links
          # load. GitHub Pages has one 404 page, so it writes the right shell.
          node .pages/scripts/pages-404.mjs _site
          touch _site/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
