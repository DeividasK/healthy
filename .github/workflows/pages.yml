name: Pages

# usehealthy.app is one GitHub Pages site: the landing page in site/ at the
# root, and the web app under /a. The landing page deploys from main whenever
# site/ changes; the app is always built from the latest release, so a landing
# page change never ships unreleased app code.
on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build the app from'
        required: true
        type: string

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - name: Resolve Release
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${INPUT_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout Release
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      # The landing page and the build action come from the default branch,
      # not from the release, so deploying an older release keeps them current.
      - name: Checkout Landing Page
        uses: actions/checkout@v7
        with:
          path: .pages
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/actions
            site
          persist-credentials: false

      - uses: pnpm/setup@v3
        with:
          cache: true

      # base_path is /healthy until the custom domain is set, then empty.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build App
        uses: ./.pages/.github/actions/build-web
        with:
          base-url: ${{ steps.pages.outputs.base_path }}/a

      - name: Assemble Site
        run: |
          mkdir _site
          cp -R .pages/site/. _site/
          cp -R dist _site/a
          # Unknown paths fall back to the app so its deep links load.
          cp _site/a/index.html _site/404.html
          touch _site/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
