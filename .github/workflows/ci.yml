name: CI

on:
  push:
    branches-ignore: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, Lint & Format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changelog check diffs the branch against origin/main.
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          save-cache: false
      - name: TypeScript Check
        run: pnpm tsc --noEmit
      - name: Lint
        run: pnpm expo lint
      - name: Format Check
        run: pnpm format:check
      - name: Expo Doctor
        run: pnpm dlx expo-doctor
      - name: Pure Function Tests
        run: pnpm test:unit
      # A branch that changes what users get adds a changie fragment
      # (pnpm changelog:new), unless a commit says "Changelog: none".
      # Tests and docs don't count. See docs/releasing.md.
      - name: Changelog Fragment Check
        if: ${{ github.ref_name != 'release' }}
        run: |
          base=$(git merge-base origin/main HEAD)
          if git diff --quiet "$base" HEAD -- app src assets public plugins patches \
            app.json app.config.js global.css tailwind.config.js \
            ':(exclude,glob)**/*.e2e.ts' ':(exclude,glob)**/*.visual.ts' \
            ':(exclude,glob)**/*.unit.ts' ':(exclude)src/features/testing'; then
            exit 0
          fi
          if git diff --name-only --diff-filter=AM "$base" HEAD -- '.changes/unreleased/*.yaml' | grep -q . ||
            ! git diff --quiet "$base" HEAD -- CHANGELOG.md ||
            git log --format=%B "$base..HEAD" | grep -qiE '^Changelog: *none *$'; then
            exit 0
          fi
          echo "::error::This branch changes the app without a changelog fragment. Run 'pnpm changelog:new', or add a 'Changelog: none' trailer to a commit when users would not notice the change."
          exit 1

  android:
    name: Android Debug Build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          save-cache: false
      - uses: ./.github/actions/android-debug-build

  build:
    name: Production Web Build
    runs-on: ubuntu-26.04
    # This job warms the same pnpm cache/runtime as the browser jobs.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/build-web

  e2e-shards:
    name: E2E shard ${{ matrix.shard }}/2
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          save-cache: false
      - name: Run E2E Tests
        env:
          PLAYWRIGHT_BLOB_REPORT: '1'
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
      - name: Upload Mergeable Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  e2e:
    name: E2E
    needs: [e2e-shards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          save-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge E2E Reports
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload Combined Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Require Every Shard to Pass
        if: ${{ always() }}
        env:
          SHARD_RESULT: ${{ needs.e2e-shards.result }}
        run: test "$SHARD_RESULT" = success

  visual:
    name: Visual Regression (Chromatic)
    # Chromatic bills every snapshot, so don't publish a push that fails the
    # basic checks; it will be pushed again anyway.
    needs: [checks]
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Chromatic bills per snapshot. When every commit on the branch can't
      # change how the app looks (CI, tooling, docs), each one says so with a
      # 'Chromatic: skip' trailer, or is Dependabot bumping action SHAs under
      # .github/. The visual tests don't run, and Chromatic marks the commit as
      # passing (its required UI Tests check) without taking any snapshots.
      - name: Check for Chromatic Skip
        id: skip
        run: |
          base=$(git merge-base origin/main HEAD)
          commits=$(git rev-list --no-merges "$base..HEAD")
          [ -n "$commits" ] || exit 0
          for commit in $commits; do
            git log -1 --format=%B "$commit" | grep -qiE '^Chromatic: *skip *$' && continue
            [ "$(git log -1 --format=%an "$commit")" = 'dependabot[bot]' ] || exit 0
            git diff --name-only "$commit^" "$commit" | grep -qv '^\.github/' && exit 0
            # A Playwright image bump renders differently, so it still runs.
            git diff "$commit^" "$commit" | grep -qE '^[-+][^-+].*image:' && exit 0
          done
          echo "Skipping visual tests: no commit on this branch can change how the app looks."
          echo "chromatic=true" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-pnpm
        with:
          save-cache: false
      - name: Run Visual Tests
        if: ${{ !steps.skip.outputs.chromatic }}
        run: pnpm test:visual
      - name: Upload Capture Timings
        if: ${{ !cancelled() && !steps.skip.outputs.chromatic }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-test-results
          path: test-results/results.json
          retention-days: 7
      - name: Upload Failed Capture Results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-test-failures
          path: test-results/
          retention-days: 7
      - name: Publish to Chromatic
        if: ${{ !steps.skip.outputs.chromatic }}
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: pnpm chromatic:publish --exit-zero-on-changes
      - name: Mark Chromatic as Passing
        if: ${{ steps.skip.outputs.chromatic }}
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: pnpm chromatic:publish --skip
