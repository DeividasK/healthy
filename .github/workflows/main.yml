name: Main

on:
  push:
    branches: [main]

jobs:
  visual:
    name: Visual Snapshots (Auto-Accept)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: pnpm/setup@v3
        with:
          cache: true

      - name: Run Visual Tests
        run: pnpm test:visual

      - name: Upload Capture Timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-results
          path: test-results/results.json
          retention-days: 7

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-report
          path: test-results/
          retention-days: 7

      - name: Accept Snapshots in Chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: pnpm chromatic:publish --auto-accept-changes=main

  # Saves the Gradle and ccache caches that branch CI builds restore.
  android:
    name: Android Debug Build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          cache: true
          save-cache: false
      - uses: ./.github/actions/android-debug-build
