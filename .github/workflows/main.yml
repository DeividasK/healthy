name: Main

on:
  push:
    branches: [main]

jobs:
  # Chromatic takes baselines from the accepted build of each pull request's
  # last commit (squash merges are matched through its GitHub app), and branches
  # must be up to date before they merge, so main publishes no snapshots of its
  # own. This job only saves the pnpm store that branch CI's Playwright
  # containers restore.
  pnpm-cache:
    name: Cache pnpm Store
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm

  # Saves the Gradle and ccache caches that branch CI builds restore.
  android:
    name: Android Debug Build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          save-cache: false
      - uses: ./.github/actions/android-debug-build
