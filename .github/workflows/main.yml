name: Main

on:
  push:
    branches: [main]
  # A manual run always publishes, to restore a missing baseline.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A merged pull request that can't change how the app looks publishes no new
  # baseline: every commit has a 'Chromatic: skip' trailer, or is Dependabot
  # bumping action SHAs under .github/. The skip only holds while main's last
  # visual build succeeded, so a missing or failed baseline is never carried
  # forward.
  chromatic-skip:
    name: Check for Chromatic Skip
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-26.04
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_EVENT_NAME" = push ] || exit 0
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          commits=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr/commits" \
            --jq '.[] | select(.parents | length == 1) | .sha')
          [ -n "$commits" ] || exit 0
          for sha in $commits; do
            commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha")
            jq -r .commit.message <<< "$commit" | grep -qiE '^Chromatic: *skip *$' && continue
            # A Playwright image bump renders differently, so it still runs.
            jq -e '.author.login == "dependabot[bot]"
              and all(.files[]; (.filename | startswith(".github/"))
                and ((.patch // "") | test("(^|\n)[-+][^\n]*image:") | not))' <<< "$commit" > /dev/null || exit 0
          done
          visual=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs?branch=main&per_page=50" \
            --jq ".workflow_runs[] | select(.run_number < $GITHUB_RUN_NUMBER) | .id" |
            while read -r run; do
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
                --jq '[.jobs[] | select(.name == "Visual Snapshots (Auto-Accept)") | .conclusion // "pending"][0] // "missing"'
            done | grep -vxm1 skipped || true)
          if [ "$visual" != success ]; then
            echo "Publishing: main's last visual build is ${visual:-missing}, so it is no baseline to keep."
            exit 0
          fi
          echo "Skipping the baseline: no commit in #$pr can change how the app looks."
          echo "skip=true" >> "$GITHUB_OUTPUT"

  # Branch builds take their baselines from main's builds. Chromatic matches a
  # squash merge to its pull request only when it builds the squash commit on
  # main, so without this job a branch inherits main's last build instead of
  # the changes accepted on the merged pull request.
  visual:
    name: Visual Snapshots (Auto-Accept)
    needs: chromatic-skip
    if: ${{ needs.chromatic-skip.outputs.skip != 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: ./.github/actions/setup-pnpm

      - name: Run Visual Tests
        run: pnpm test:visual

      - name: Upload Capture Timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-test-results
          path: test-results/results.json
          retention-days: 7

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-test-report
          path: test-results/
          retention-days: 7

      - name: Accept Snapshots in Chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: pnpm chromatic:publish --auto-accept-changes=main

  # Saves the Gradle and ccache caches that branch CI builds restore.
  android:
    name: Android Debug Build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          save-cache: false
      - uses: ./.github/actions/android-debug-build
