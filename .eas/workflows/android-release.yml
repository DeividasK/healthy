name: Android release

# Every push to main that can change the app builds a production AAB and
# submits it to Google Play's internal testing track (see eas.json `submit`).
on:
  push:
    branches: ['main']
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!public/**'
      - '!.github/**'

# Every job runs its own `pnpm install`, and package.json requires exactly this
# Node version (devEngines). Build jobs also get it from eas.json, but the
# submit job only gets it from here.
defaults:
  tools:
    node: 22.23.2

jobs:
  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production
  # Uploads as a draft (eas.json `submit.production.android.releaseStatus`), so
  # each release still needs "Start rollout" in Play Console. Google Play only
  # accepts drafts until the app has been published once; after that, switch
  # releaseStatus to "completed" to roll out to internal testers automatically.
  submit_android:
    name: Submit to internal testing
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
