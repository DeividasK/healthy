name: Android release

# Every push to `release` builds a production AAB and submits it to Google
# Play's internal testing track (see eas.json `submit`). `main` publishes
# nothing; see docs/releasing.md.
on:
  push:
    branches: ['release']

# Every job runs its own `pnpm install`, and package.json requires exactly this
# Node version (devEngines). Build jobs also get it from eas.json, but the
# submit job only gets it from here.
defaults:
  tools:
    node: 22.23.2

# Releases come only from `release`, also when the workflow is run by hand on
# another branch; branches get a debug build check in GitHub CI instead.
jobs:
  # A release ships only a prepared version: its CHANGELOG.md section exists
  # and no fragments are left unreleased.
  verify_release:
    name: Verify release notes
    if: ${{ github.ref_name == 'release' }}
    steps:
      - uses: eas/checkout
      - name: Verify release notes
        run: node scripts/changelog.ts verify
  build_android:
    name: Build Android
    needs: [verify_release]
    type: build
    params:
      platform: android
      profile: production
  # Uploads as a draft (eas.json `submit.production.android.releaseStatus`), so
  # each release still needs "Start rollout" in Play Console, where its release
  # notes are pasted from the GitHub Release.
  submit_android:
    name: Submit to internal testing
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
