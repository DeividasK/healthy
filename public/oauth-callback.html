<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Healthy</title>
    <style>
      body {
        margin: 0;
        padding: 48px 16px;
        background: #fffdf9;
        color: #1a1c1a;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <p>Signed in with Google. You can close this window.</p>
    <script>
      // Google sends the sign-in code here. It goes to the Healthy tab that
      // opened this window (see authorizeWithTokenService), which checks the
      // state before using it. BroadcastChannel works even when Google's pages
      // cut this window off from its opener.
      const params = new URLSearchParams(location.search);
      history.replaceState(null, '', location.pathname);
      const channel = new BroadcastChannel('healthy-google-auth');
      channel.postMessage({
        state: params.get('state'),
        code: params.get('code'),
        error: params.get('error'),
      });
      channel.close();
      window.close();
    </script>
  </body>
</html>
