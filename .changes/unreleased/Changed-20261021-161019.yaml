kind: Changed
body: Labs Summary is now called Biomarkers. On Home it is a compact grid with one square per biomarker, out-of-range results first, so you can see at a glance how many are out of range; its key counts only the statuses you have, including No range. Tap a square to open that biomarker, or the heading to see every result.
