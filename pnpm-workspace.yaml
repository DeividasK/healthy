packages:
  - '.'

# React Native tooling (Metro, Babel presets, Gradle autolinking) expects a
# flat node_modules. pnpm 11+ ignores node-linker in .npmrc, so it lives here.
nodeLinker: hoisted

allowBuilds:
  esbuild: true
  unrs-resolver: false

patchedDependencies:
  '@expo/metro-config': patches/@expo__metro-config.patch
  expo-sqlite: patches/expo-sqlite.patch

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.32'
  - '@expo/config-plugins@57.0.11'
  - '@expo/router-server@57.0.14'
  - expo-modules-core@57.0.24
  - expo-modules-jsi@57.1.3
  - expo@57.0.31
  - '@expo/ui@57.0.26'
  - expo-network@57.0.3
  - expo-router@57.0.29
  - expo-sharing@57.0.24
